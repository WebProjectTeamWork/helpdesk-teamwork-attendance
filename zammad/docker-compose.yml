# Zammad helpdesk – Docker Compose setup
# Based on the official https://github.com/zammad/zammad-docker-compose,
# trimmed down for local/lab use. Configure via the .env file.

x-shared:
  zammad-service: &zammad-service
    image: ${IMAGE_REPO:-ghcr.io/zammad/zammad}:${VERSION:-7.2.2-0024}
    init: true
    restart: ${RESTART:-unless-stopped}
    environment: &zammad-environment
      TZ: ${TZ:-Europe/Bucharest}
      # Database
      POSTGRESQL_HOST: zammad-postgresql
      POSTGRESQL_PORT: 5432
      POSTGRESQL_DB: ${POSTGRES_DB:-zammad_production}
      POSTGRESQL_USER: ${POSTGRES_USER:-zammad}
      POSTGRESQL_PASS: ${POSTGRES_PASS:-zammad}
      POSTGRESQL_OPTIONS: "?pool=50"
      POSTGRESQL_DB_CREATE: "false"   # DB is created by the postgres container
      # Cache / queues
      MEMCACHE_SERVERS: zammad-memcached:11211
      REDIS_URL: redis://zammad-redis:6379
      # Search
      ELASTICSEARCH_ENABLED: ${ELASTICSEARCH_ENABLED:-true}
      ELASTICSEARCH_SCHEMA: http
      ELASTICSEARCH_HOST: zammad-elasticsearch
      ELASTICSEARCH_PORT: 9200
      # Web
      NGINX_PORT: 8080
      NGINX_SERVER_SCHEME: ${NGINX_SERVER_SCHEME:-http}
      NGINX_CLIENT_MAX_BODY_SIZE: ${NGINX_CLIENT_MAX_BODY_SIZE:-50M}
      ZAMMAD_HTTP_TYPE: ${ZAMMAD_HTTP_TYPE:-http}
      ZAMMAD_FQDN: ${ZAMMAD_FQDN:-localhost}
      # Backups
      BACKUP_DIR: /var/tmp/zammad
      BACKUP_TIME: ${BACKUP_TIME:-03:00}
      HOLD_DAYS: ${HOLD_DAYS:-10}
    volumes:
      - zammad-backup:/var/tmp/zammad:ro
      - zammad-storage:/opt/zammad/storage
    depends_on:
      zammad-memcached:
        condition: service_healthy
      zammad-postgresql:
        condition: service_healthy
      zammad-redis:
        condition: service_healthy

services:
  # One-shot job: runs DB migrations, seeds data, builds the search index.
  zammad-init:
    <<: *zammad-service
    command: ["zammad-init"]
    restart: on-failure
    user: 0:0
    depends_on:
      zammad-memcached:
        condition: service_healthy
      zammad-postgresql:
        condition: service_healthy
      zammad-redis:
        condition: service_healthy
      zammad-elasticsearch:
        condition: service_healthy

  # One-shot job: creates the admin/agent accounts and the project tickets from ./seed.
  # Idempotent, so it is safe on every `docker compose up`.
  zammad-seed:
    <<: *zammad-service
    command: ["bundle", "exec", "rails", "r", "/opt/zammad-seed/seed.rb"]
    restart: on-failure
    environment:
      <<: *zammad-environment
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-Admin2026!Pass}
      SEED_AGENT_PASSWORD: ${SEED_AGENT_PASSWORD:-Teamwork2026!}
    volumes:
      - ./seed:/opt/zammad-seed
      - zammad-storage:/opt/zammad/storage
    depends_on:
      zammad-init:
        condition: service_completed_successfully

  zammad-railsserver:
    <<: *zammad-service
    command: ["zammad-railsserver"]
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:3000"]
      interval: 30s
      timeout: 5s
      start_period: 120s
      retries: 3

  zammad-scheduler:
    <<: *zammad-service
    command: ["zammad-scheduler"]

  zammad-websocket:
    <<: *zammad-service
    command: ["zammad-websocket"]

  zammad-nginx:
    <<: *zammad-service
    command: ["zammad-nginx"]
    init: false
    ports:
      - "${ZAMMAD_PORT:-8080}:8080"
    depends_on:
      zammad-railsserver:
        condition: service_healthy

  zammad-backup:
    <<: *zammad-service
    command: ["zammad-backup"]
    user: 0:0
    volumes:
      - zammad-backup:/var/tmp/zammad
      - zammad-storage:/opt/zammad/storage

  zammad-postgresql:
    image: postgres:${POSTGRES_VERSION:-17.11-alpine}
    restart: ${RESTART:-unless-stopped}
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-zammad_production}
      POSTGRES_USER: ${POSTGRES_USER:-zammad}
      POSTGRES_PASSWORD: ${POSTGRES_PASS:-zammad}
    volumes:
      - postgresql-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "psql -h 127.0.0.1 -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\" -qc 'SELECT 1' >/dev/null"]
      interval: 10s
      timeout: 5s
      start_period: 60s
      retries: 5

  zammad-elasticsearch:
    image: elasticsearch:${ELASTICSEARCH_VERSION:-9.5.5}
    restart: ${RESTART:-unless-stopped}
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: ${ELASTICSEARCH_JAVA_OPTS:--Xms1g -Xmx1g}
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:9200/_cluster/health | grep -qE '\"status\":\"(green|yellow)\"'"]
      interval: 15s
      timeout: 5s
      start_period: 90s
      retries: 10

  zammad-memcached:
    image: memcached:${MEMCACHE_VERSION:-1.6.45-alpine}
    command: memcached -m 256M
    restart: ${RESTART:-unless-stopped}
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "11211"]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 5

  zammad-redis:
    image: redis:${REDIS_VERSION:-8.10.3-alpine}
    restart: ${RESTART:-unless-stopped}
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 5

volumes:
  elasticsearch-data:
  postgresql-data:
  redis-data:
  zammad-backup:
  zammad-storage:
